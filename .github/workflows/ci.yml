name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: ["ubuntu-24.04", "windows-2022", "macos-latest"]

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: 17
        distribution: temurin
    - uses: sbt/setup-sbt@v1
    - name: Mount caches
      uses: actions/cache@v6
      with:
        path: |
          ~/.sbt
          ~/.ivy2/cache
          ~/.cache/coursier
        key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt') }}
    - name: Compile and test
      run: |
       sbt "+ test"
      shell: bash
    - name: Format check
      if: ${{ runner.os == 'Linux' }}
      run: |
        sbt 'scalafmtCheck; Test / scalafmtCheck; scalafmtSbtCheck'
  protobuf-runtime:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        protobuf: ["4.28.2", "4.33.4", "4.35.0"]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: 17
        distribution: temurin
    - uses: sbt/setup-sbt@v1
    - uses: actions/cache@v6
      with:
        path: |
          ~/.sbt
          ~/.ivy2/cache
          ~/.cache/coursier
        key: protobuf-runtime-${{ matrix.protobuf }}-${{ hashFiles('**/*.sbt') }}
    - name: Test baseline bytecode with newer protobuf runtimes
      run: sbt -Dprotobuf.test.version=${{ matrix.protobuf }} '+ protocGenRuntimeTests / test'

  # Single final job for mergify.
  ci-passed:
    runs-on: ubuntu-latest
    needs: [build, protobuf-runtime]
    steps:
    - run: ':'
